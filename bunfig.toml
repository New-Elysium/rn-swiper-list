# DBounce bunfig.toml
# Bun package manager configuration

[install]

# Whether to install optionalDependencies
optional = true

# Whether to install devDependencies
dev = true

# Whether to install peerDependencies
peer = true

# Equivalent to `--production` flag
production = false

# Equivalent to `--save-text-lockfile` flag
saveTextLockfile = true

# Equivalent to `--frozen-lockfile` flag
frozenLockfile = false

# Equivalent to `--dry-run` flag
dryRun = false

# Equivalent to `--concurrent-scripts` flag
# (cpu count or GOMAXPROCS) x2
concurrentScripts = 16

# Installation strategy: "hoisted" or "isolated"
# Works better with workspaces and legacy tooling
linker = "hoisted"

# Minimum age of packages before they can be installed
# Prevents supply chain attacks from newly published malicious versions
# 3 days in seconds
minimumReleaseAge = 259200

# Well-known stable packages excluded from minimum release age check
minimumReleaseAgeExcludes = [
  "@types/node",
  "@types/react",
  "@types/react-dom",
  "typescript",
  "react",
  "react-dom",
  "eslint",
]

[install.cache]

# When true, don't load from the global cache.
# Bun may still write to node_modules/.cache
disable = false

# When true, always resolve the latest versions from the registry
disableManifest = false

# Save lockfile as text for better diffs and readability (yarnpkg format)
[install.lockfile]

print = "yarn"
